name: CI / Frontend

on:
  workflow_call:
    inputs:
      matrix_json:
        description: 'JSON matrix with Vue3 web and mobile entries under include'
        required: true
        type: string

permissions:
  contents: read

jobs:
  frontend:
    name: ${{ matrix.project.framework }} / ${{ matrix.project.target }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        project: ${{ fromJSON(inputs.matrix_json).include }}
    defaults:
      run:
        shell: bash
        working-directory: ruoyi-fastapi-frontend/vue3/${{ matrix.project.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: ruoyi-fastapi-frontend/vue3/${{ matrix.project.target }}/package.json
      - name: Locate the pnpm store
        id: package-cache
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.package-cache.outputs.path }}
          key: ${{ runner.os }}-node${{ matrix.node }}-vue3-${{ matrix.project.target }}-${{ hashFiles(format('ruoyi-fastapi-frontend/vue3/{0}/pnpm-lock.yaml', matrix.project.target), format('ruoyi-fastapi-frontend/vue3/{0}/pnpm-workspace.yaml', matrix.project.target), format('ruoyi-fastapi-frontend/vue3/{0}/package.json', matrix.project.target)) }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node }}-vue3-${{ matrix.project.target }}-
      - name: Install dependencies from the committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Record resolved dependency versions
        run: |
          mkdir -p test-results
          node --version > test-results/node-version.txt
          if ! pnpm list --depth Infinity --json > test-results/dependency-tree.json; then
            echo "Dependency tree includes peer diagnostics; inspect dependency-tree.json." >&2
          fi
      - name: Run unit and component behavior tests
        run: pnpm run test:unit
      - name: Verify time contracts in three host timezones
        run: |
          for zone in UTC Asia/Shanghai America/New_York; do
            TZ="$zone" pnpm run test:contract
          done
      - name: Build Web production and Docker targets
        if: matrix.project.target == 'web'
        run: |
          pnpm run build:prod
          pnpm run build:docker
      - name: Build Mobile H5
        if: matrix.project.target == 'mobile'
        run: pnpm run build:h5
      - uses: actions/setup-python@v6
        if: matrix.project.target == 'mobile'
        with:
          python-version: '3.12'
      - name: Install the Mobile smoke browser
        if: matrix.project.target == 'mobile'
        run: |
          python -m pip install playwright==1.64.0
          python -m playwright install --with-deps chromium
      - name: Verify Mobile H5 login and profile
        if: matrix.project.target == 'mobile'
        working-directory: .
        run: python .github/scripts/mobile_smoke.py --framework vue3
      - name: Build Mobile WeChat target
        if: matrix.project.target == 'mobile'
        run: pnpm run build:mp-weixin
      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-${{ matrix.project.framework }}-${{ matrix.project.target }}-node${{ matrix.node }}
          path: |
            target/ci/mobile-smoke/vue3/
            ruoyi-fastapi-frontend/vue3/${{ matrix.project.target }}/test-results/
          if-no-files-found: ignore
          retention-days: 7
