services:
  # 前端服务
  ruoyi-frontend:
    build:
      context: ./ruoyi-fastapi-frontend/vue3/web
      dockerfile: Dockerfile
    image: ruoyi-frontend:latest
    container_name: ruoyi-frontend
    environment:
      TZ: UTC
    ports:
      - "12580:80"
    volumes:
      - ./ruoyi-fastapi-frontend/vue3/web/bin/nginx.dockermy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - ruoyi-backend-my
    networks:
      - ruoyi-network

  # 后端服务（MySQL版本）
  ruoyi-backend-my:
    build:
      context: ./ruoyi-fastapi-backend
      dockerfile: Dockerfile.my
    image: ruoyi-backend-my:latest
    container_name: ruoyi-backend-my
    environment:
      TZ: UTC
      RUOYI_PLUGIN_FRONTEND_FRAMEWORK: vue3
    ports:
      - "19099:9099"
    volumes:
      # UploadConfig 的上传、私有文件、回收站、隔离区与下载均位于 vf_admin 下。
      - ./ruoyi-fastapi-backend/vf_admin:/app/vf_admin
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
    networks:
      - ruoyi-network

  # 独立调度进程：复用后端镜像与文件存储，不监听 Web 端口。
  ruoyi-scheduler-my:
    build:
      context: ./ruoyi-fastapi-backend
      dockerfile: Dockerfile.my
    image: ruoyi-backend-my:latest
    container_name: ruoyi-scheduler-my
    command: ["ruoyi", "job", "worker", "--env=dockermy"]
    environment:
      TZ: UTC
      RUOYI_PLUGIN_FRONTEND_FRAMEWORK: vue3
    volumes:
      - ./ruoyi-fastapi-backend/vf_admin:/app/vf_admin
    restart: unless-stopped
    stop_grace_period: 25s
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
      # 仅保证 Web 容器已启动，不代表表结构初始化或 HTTP 就绪。
      ruoyi-backend-my:
        condition: service_started
    networks:
      - ruoyi-network

  # MySQL服务
  ruoyi-mysql:
    image: mysql:8.0
    container_name: ruoyi-mysql
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ruoyi-fastapi
    ports:
      - "13306:3306"
    volumes:
      - ./ruoyi-fastapi-backend/sql/ruoyi-fastapi.sql:/docker-entrypoint-initdb.d/ruoyi-fastapi.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --skip-character-set-client-handshake=1
    networks:
      - ruoyi-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Redis服务
  ruoyi-redis:
    image: redis:latest
    container_name: ruoyi-redis
    environment:
      TZ: UTC
    ports:
      - "16379:6379"
    networks:
      - ruoyi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  ruoyi-network:
    name: ruoyi-network
    driver: bridge
